name: macOS preview build
on:
  push:
    branches: [macos-safari-preview]
  pull_request:
    paths: ['macos/**', '.github/workflows/macos-preview.yml']
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and verify Universal 2 installer
        run: bash macos/build-app.sh
      - name: Check adapter in macOS WebKit
        run: |
          xcrun swiftc -swift-version 5 -framework AppKit -framework WebKit macos/tests/WebKitCore.swift -o package/macos-dist/WebKitCoreCheck
          package/macos-dist/WebKitCoreCheck src/adapter.cjs
      - name: Compile Safari extension container
        run: bash macos/build-safari.sh
      - name: Upload test packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FlowBridge-macOS-preview
          path: |
            package/macos-dist/*.zip
            package/macos-dist/*.json
            package/macos-dist/*.xpi
            package/macos-dist/README.md
          if-no-files-found: error
          retention-days: 30
